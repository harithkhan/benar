name: Release

# The app of Benar, as a .zip file.
#
# A run by hand makes the .zip file as an artefact and publishes nothing. A
# tag `v<version>` also makes a DRAFT release with the .zip file and its
# SHA-256. The owner publishes the draft.
#
# The app has no developer identity and it is not notarised. The job signs it
# ad hoc, because an Apple silicon Mac does not start an app with a broken
# signature. The workflow uses no secret.
#
# The actions are named by their commit; the comment gives the version.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: macOS app
    # `macos-latest` is an Apple silicon Mac. The repository is public, so the
    # job runs on a hosted runner, never on a computer of the owner.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The .zip file carries the version of the app, not the name of the
      # tag. A tag that is not `v` and that version stops here, before the
      # build.
      - name: The tag is the version of the app
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "The tag is not v$version, the version of package.json."
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A release does not go out with a failed type check or a failed test.
      - run: pnpm verify

      - run: pnpm package --arch=arm64

      # The package step changes the app after Electron was signed, so the
      # signature is broken. A Mac shows such an app as "damaged".
      - name: Sign the app ad hoc and check the signature
        run: |
          set -euo pipefail
          app=out/Benar-darwin-arm64/Benar.app
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

      # `ditto` keeps the links and the attributes of an app bundle.
      - name: Make the .zip file and check the app inside
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          mkdir -p dist
          zip="dist/Benar-$version-arm64.zip"
          ditto -c -k --keepParent out/Benar-darwin-arm64/Benar.app "$zip"
          check=$(mktemp -d)
          ditto -x -k "$zip" "$check"
          codesign --verify --deep --strict "$check/Benar.app"
          rm -rf "$check"
          (cd dist && shasum -a 256 "Benar-$version-arm64.zip" > "Benar-$version-arm64.zip.sha256")
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Draft release
    # Only the push of a tag makes a release; a run by hand on a tag makes
    # none. This job installs no package: it uses the `gh` program of the
    # runner.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: mac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app
          path: release

      - name: Check the SHA-256 of the .zip file
        working-directory: release
        run: sha256sum --check ./*.sha256

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Benar ${TAG#v}" \
            --notes "Benar ${TAG#v} for a Mac with Apple silicon. The app has no developer identity and it is not notarised. The .sha256 file holds the SHA-256 of the .zip file." \
            release/*.zip release/*.sha256
